<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Book Reader</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 250px;
    padding: 12px;
    box-sizing: border-box;
    font-size: 17px;
    margin-top: 15px;
}

input[type="file"] {
    width: 100%;
    padding: 15px 0;
}

select,
button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    border-radius: 8px;
}

button {
    background: #222;
    color: white;
    border: none;
}

#status {
    margin-top: 15px;
    padding: 10px;
    background: #eee;
    border-radius: 8px;
}

</style>
</head>

<body>

<div class="container">

<h1>📖 AI Book Reader</h1>

<p>📄 Choisir un livre PDF :</p>

<input
    type="file"
    id="pdfFile"
    accept="application/pdf"
>

<div id="status">
Aucun PDF sélectionné.
</div>

<textarea
    id="text"
    placeholder="Le texte du livre apparaîtra ici..."
></textarea>

<select id="language">

<option value="fr">🇫🇷 Français</option>

<option value="en">🇬🇧 English</option>

<option value="ar">🇸🇦 العربية</option>

</select>

<select id="voice">

<option value="">Chargement des voix...</option>

</select>

<button onclick="speak()">
▶️ Lire le texte
</button>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const pdfFile = document.getElementById("pdfFile");

const textArea = document.getElementById("text");

const status = document.getElementById("status");

const language = document.getElementById("language");

const voiceSelect = document.getElementById("voice");

let voices = [];


pdfFile.addEventListener("change", async function() {

    const file = pdfFile.files[0];

    if (!file) {
        return;
    }

    status.textContent = "⏳ Lecture du PDF...";

    try {

        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: arrayBuffer
        }).promise;

        let fullText = "";

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

            status.textContent =
                "📖 Lecture de la page " +
                pageNumber +
                " / " +
                pdf.numPages;

            const page =
                await pdf.getPage(pageNumber);

            const content =
                await page.getTextContent();

            const pageText =
                content.items
                .map(item => item.str)
                .join(" ");

            fullText += pageText + "\n\n";
        }

        textArea.value = fullText;

        status.textContent =
            "✅ PDF terminé : " +
            pdf.numPages +
            " pages.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Impossible de lire ce PDF.";

    }

});


function loadVoices() {

    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    const selectedLanguage =
        language.value.toLowerCase();

    const matchingVoices =
        voices.filter(voice => {

            const voiceLanguage =
                voice.lang.toLowerCase();

            return voiceLanguage.startsWith(
                selectedLanguage
            );

        });


    if (matchingVoices.length === 0) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "Aucune voix disponible";

        voiceSelect.appendChild(option);

        return;
    }


    matchingVoices.forEach(voice => {

        const option =
            document.createElement("option");

        option.value =
            voices.indexOf(voice);

        option.textContent =
            voice.name +
            " (" +
            voice.lang +
            ")";

        voiceSelect.appendChild(option);

    });

}


function speak() {

    const text =
        textArea.value.trim();

    if (!text) {

        alert("Ajoute d'abord un texte ou un PDF.");

        return;
    }


    const speech =
        new SpeechSynthesisUtterance(text);


    const index =
        parseInt(voiceSelect.value);


    if (!isNaN(index) && voices[index]) {

        speech.voice =
            voices[index];

        speech.lang =
            voices[index].lang;

    } else {

        speech.lang =
            language.value;

    }


    speech.rate = 1;

    speech.pitch = 1;


    speechSynthesis.cancel();

    speechSynthesis.speak(speech);

}


language.addEventListener(
    "change",
    loadVoices
);


speechSynthesis.onvoiceschanged =
    loadVoices;


loadVoices();

</script>

</body>
</html>
